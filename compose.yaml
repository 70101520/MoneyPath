services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: moneypath
      POSTGRES_DB: moneypath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneypath -d moneypath']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://moneypath:${POSTGRES_PASSWORD}@db:5432/moneypath
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://moneypath:${POSTGRES_PASSWORD}@db:5432/moneypath
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:

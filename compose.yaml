services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: moneypath
      POSTGRES_DB: moneypath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneypath -d moneypath']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://moneypath:${POSTGRES_PASSWORD}@db:5432/moneypath
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ['pull', '${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}']
    depends_on:
      ollama:
        condition: service_healthy
  gpt-oss:
    profiles: ['gpt-oss']
    image: vllm/vllm-openai:latest
    command: ['--model', 'openai/gpt-oss-20b', '--host', '0.0.0.0', '--port', '8000']
    volumes:
      - gpt_oss_hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://moneypath:${POSTGRES_PASSWORD}@db:5432/moneypath
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}
      JOB_SECRET: ${JOB_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      GPT_OSS_BASE_URL: ${GPT_OSS_BASE_URL:-http://gpt-oss:8000/v1}
      GPT_OSS_MODEL: ${GPT_OSS_MODEL:-openai/gpt-oss-20b}
      VOICE_BASE_URL: http://voice:8090
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
  voice:
    build: ./services/voice
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      HF_HOME: /models/huggingface
    volumes:
      - voice_models:/models
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  notifier:
    image: moneypath-app
    command: ['node', 'notification-worker.mjs']
    environment:
      JOB_SECRET: ${JOB_SECRET:-}
      NOTIFICATION_JOB_URL: http://app:3000/api/jobs/notifications
      NOTIFICATION_INTERVAL_MS: ${NOTIFICATION_INTERVAL_MS:-21600000}
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  ollama_data:
  gpt_oss_hf_cache:
  voice_models:
